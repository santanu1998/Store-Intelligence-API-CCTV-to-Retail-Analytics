spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  batch:
    max-ingest-size: 500
  conversion:
    billing-window-minutes: 5
    billing-zone-keywords:
      - BILLING
      - CHECKOUT
  anomaly:
    queue-spike-threshold: 5
    abandonment-warn-threshold: 0.30
    conversion-drop-factor: 0.70
    dead-zone-minutes: 30
    stale-feed-minutes: 10
  store:
    default-id: STORE_TEST_001
