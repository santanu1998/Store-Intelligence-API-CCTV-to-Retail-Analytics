version: "3.9"

# ─────────────────────────────────────────────────────────────
#  Store Intelligence — docker compose up
#  Starts MySQL 8 + the Spring Boot API in one command.
# ─────────────────────────────────────────────────────────────

services:

  # ── MySQL 8 ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: store-intel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Santanu@2026"
      MYSQL_DATABASE: store_intelligence
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pSantanu@2026"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Store Intelligence API ───────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intel-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/store_intelligence?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "Santanu@2026"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
    driver: local
